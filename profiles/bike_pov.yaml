# ReelForge ContentProfile — footage mode
# Bike POV shorts cut from real Insta360 rides.
id: bike_pov
niche: "mountain & city cycling POV"
channel:
  youtube: "@itsrocketriderdude"
  instagram: "rocketriderdude"    # must be a Business account for API publishing

audience:
  intent: [entertain, inspire]   # Axis A
  segment: gen_z_millennial      # Axis B
  relationship: hobbyist_enthusiast  # Axis C
  age: "18-34"
  tone: high_energy

source:
  mode: footage                  # footage | generative | hybrid
  connectors: [insta360_cloud, gdrive, local]
  watch: true                    # auto-pull new files
  proxy_transcode: true          # fast, low-res copies for analysis

research:
  enabled: true
  signals: [youtube_trending, google_trends, tiktok_cc, instagram]
  ideas_per_run: 5

understand:
  scene_detect: pyscenedetect
  transcribe: whisper
  highlight_scorer: claude_vision
  score_for: [speed, near_miss, scenery, air_time]

edit:
  aspect_ratio: "9:16"
  length_s: [6, 12]              # short punchy highlights
  clips_per_video: [1, 2]
  max_total_s: 16               # hard cap: reels stay <=16s
  hook_first: true
  reframe: subject_track
  captions:
    enabled: true
    source: ai                   # Claude 'sees' the scene + writes rider-voice overlay lines
    style: clean_bottom          # polished sans + subtle bar, lower third
    count: 4
    keyframes: 3                 # frames sent to Claude vision
    themes: [biker life, relationships, faith, inner peace, self improvement, gratitude]
    vibe: reflective             # default mood; override per clip with `--vibe <name>`
    font: "Bebas Neue"          # aesthetic cinematic all-caps caption font
    uppercase: true
    size_pct: 0.058             # bigger (~111px @1920)
  color_grade:
    lut: teal_orange_punch
    look: vivid_action
  music:
    enabled: true
    source: fal                  # fal.ai Stable Audio bed under the ride audio
    mood: "upbeat indie folk-pop, acoustic guitar, hand claps, punchy drums, warm bass, feel-good and hopeful, around 115 BPM"
    source_lufs: -18            # engine softer (sits under the music)
    music_lufs: -13            # music louder / leads the mix
  voiceover:
    enabled: false

publish:
  platforms: [youtube_shorts, instagram_reels]
  schedule: best_time
  daily_cap: 2
  approval: required             # required | auto
  ai_disclosure: false
  made_for_kids: false
  hashtags: ["#Shorts", "#mtb", "#cycling", "#pov"]

budget:
  max_usd_per_video: 0.50

# ---- Vibe library --------------------------------------------------------
# Pick one per clip (profile default above, or `reelforge run --vibe <name>`).
# Each vibe steers Claude's caption themes + trending keywords, the fal music
# prompt, and the hashtags — so the words and the music match the clip's mood.
# Themes/keywords/tags are grounded in 2026 moto/bike short-form trend research.
vibes:
  reflective:                    # "the only therapy I need is the open road"
    themes: [inner peace, clarity, letting go, gratitude, mental therapy, self improvement]
    keywords: [therapy, wind in my face, open road, quiet mind, clear head]
    music_mood: "warm mellow lofi, soft acoustic guitar, gentle keys, calm and reflective, around 80 BPM"
    hashtags: ["#Shorts", "#bikelife", "#motovlog", "#ride", "#mentalhealth"]
    font: "Bebas Neue"
    look: warm_storybook
  freedom:                       # open-road / adventure / escape
    themes: [freedom, open road, adventure, escape, chasing the horizon]
    keywords: [freedom, open road, sunset ride, horizon, no limits]
    music_mood: "uplifting indie folk-pop, acoustic guitar, warm bass, hopeful and free, around 115 BPM"
    hashtags: ["#Shorts", "#bikelife", "#freedom", "#adventure", "#sunsetride"]
    font: "Bebas Neue"
    look: golden_hour
  adrenaline:                    # send it / speed / no fear
    themes: [adrenaline, speed, sending it, no fear, feeling alive]
    keywords: [throttle, send it, redline, adrenaline, full send]
    music_mood: "high-energy electronic rock, driving drums, aggressive synth bass, intense, around 140 BPM"
    hashtags: ["#Shorts", "#motorcycle", "#sendit", "#adrenaline", "#superbike"]
    font: "Anton"
    look: vivid_action
  soul:                          # "two wheels move the soul"
    themes: [passion, soul, born to ride, one with the machine, the ride is life]
    keywords: [two wheels, born to ride, soul, one with the machine]
    music_mood: "cinematic rock, electric guitar, epic building drums, powerful and emotional, around 120 BPM"
    hashtags: ["#Shorts", "#twowheels", "#borntoride", "#bikelife", "#rider"]
    font: "Anton"
    look: moody_contrast
  faith:                         # gratitude / grace / purpose
    themes: [faith, gratitude, blessings, grace, purpose, trust]
    keywords: [grateful, blessed, faith, grace, thankful]
    music_mood: "warm uplifting acoustic, gentle piano, hopeful strings, spiritual and grateful, around 90 BPM"
    hashtags: ["#Shorts", "#blessed", "#faith", "#gratitude", "#ride"]
    font: "Montserrat"
    look: warm_storybook
  brotherhood:                   # crew / ride-together / loyalty
    themes: [brotherhood, crew, riding together, loyalty, found family]
    keywords: [crew, ride or die, brotherhood, together, family]
    music_mood: "feel-good indie anthem, group claps, warm guitars, energetic and communal, around 118 BPM"
    hashtags: ["#Shorts", "#bikelife", "#brotherhood", "#ridetogether", "#motovlog"]
    font: "Oswald"
    look: vivid_action
  funny:                         # relatable rider humor
    themes: [relatable rider humor, bike vs responsibilities, my therapist is my bike, one more mile]
    keywords: [therapy, addicted, one more mile, born to ride forced to work]
    music_mood: "playful upbeat pop, bouncy plucks, quirky and light, fun, around 120 BPM"
    hashtags: ["#Shorts", "#bikelife", "#relatable", "#motovlog", "#funny"]
    font: "Montserrat"
    look: clean_bright
  aesthetic:                     # cinematic chill / golden hour
    themes: [aesthetic, cinematic, golden hour, slow living, present moment, stillness]
    keywords: [golden hour, sunset, aesthetic, slow, cinematic]
    music_mood: "dreamy chillwave, warm analog synth, mellow beat, atmospheric and cinematic, around 100 BPM"
    hashtags: ["#Shorts", "#aesthetic", "#sunsetride", "#cinematic", "#bikelife"]
    font: "Montserrat"
    look: cinematic_teal
  discipline:                    # self-improvement / grind / mindset
    themes: [discipline, self improvement, consistency, becoming better, focus, mindset]
    keywords: [discipline, grind, focus, get better, mindset]
    music_mood: "motivational cinematic, building drums, determined piano, driving and focused, around 110 BPM"
    hashtags: ["#Shorts", "#discipline", "#selfimprovement", "#mindset", "#motivation"]
    font: "Oswald"
    look: moody_contrast
